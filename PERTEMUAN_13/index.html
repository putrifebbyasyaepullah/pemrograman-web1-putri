<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 13</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Judul -->
    <h1>Script Dasar JavaScript</h1>

    <!-- Aplikasi Nilai -->
    <div class="container">
        <h2>Aplikasi Nilai Mahasiswa</h2>

        <!-- Input Data -->
        <label>Nama Mahasiswa :</label>
        <input type="text" id="nama"
        placeholder="Masukkan Nama Anda">

        <label>Nilai Mahasiswa :</label>
        <input type="number" id="nilai"
        placeholder="Masukkan Nilai Anda">

        <!-- Tombol -->
        <button onclick="hitungNilai()">Hitung Nilai</button>

        <!-- Hasil -->
        <div id="hasil"></div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
