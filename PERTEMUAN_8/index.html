<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Website Pendaftaran Mahasiswa</title>
</head>

<body>

    <h1>Website Pendaftaran Mahasiswa</h1>

    <ul>
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Profil</a></li>
        <li><a href="#">Pendaftaran</a></li>
    </ul>

    <h2>Form Pendaftaran</h2>

    <form>

        <label>Nama :</label>
        <input type="text" placeholder="masukan nama anda">
        <br>

        <label>Email :</label>
        <input type="email" placeholder="masukan email anda">
        <br>

        <label>Password :</label>
        <input type="password" placeholder="masukan pass anda">
        <br>

        <label>Tanggl Lahir :</label>
        <input type="date">
        <br>

        <label>Umur :</label>
        <input type="number" style="width: 45px;">
        <br>

        <label>Upload :</label>
        <input type="file">
        <br>

        <label>Gender :</label>
        <input type="radio" name="gender">Perempuan
        <input type="radio" name="gender">Laki-laki
        <br>

        <label>Hobi :</label>
        <select>
            <option>---HOBI---</option>
            <option>Membaca</option>
            <option>Menulis</option>
            <option>Olahraga</option>
            <option>Musik</option>
        </select>
        <br>

        <label>Alamat :</label>
        <textarea 
            rows="7" 
            cols="55" 
            placeholder="masukan alamat"></textarea>
        <br>

        <button type="submit">Simpan</button>

    </form>

    <p>© 2026 Website Pendaftaran</p>

</body>
</html>
